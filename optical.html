<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical File Transfer (Debug Mode)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; color: #333; }
        h1 { text-align: center; }
        .container { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 768px) { .container { flex-direction: row; } }
        .card { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { padding: 8px 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-bottom: 5px; }
        .btn:hover { background-color: #0056b3; }
        .btn-danger { background-color: #dc3545; }
        .btn-warning { background-color: #ffc107; color: #000; }
        
        /* CRITICAL FIX: The Quiet Zone */
        #qrcode-container { 
            display: flex; 
            justify-content: center; 
            align-items: center;
            margin-top: 20px; 
            min-height: 300px;
            background-color: #eee;
            border-radius: 8px;
        }
        #qrcode {
            /* Scanners REQUIRE a white border to recognize the corners */
            padding: 20px;
            background-color: white; 
            border: 2px solid #ccc;
        }
        
        .status { font-weight: bold; margin-top: 10px; text-align: center; }
        #reader { width: 100%; margin-top: 15px; }
        .progress-bar { width: 100%; background-color: #e0e0e0; border-radius: 4px; margin-top: 10px; overflow: hidden; display: none; }
        .progress-fill { height: 20px; background-color: #28a745; width: 0%; transition: width 0.2s; }
        .debug-log { background: #333; color: #0f0; padding: 10px; font-family: monospace; font-size: 12px; height: 100px; overflow-y: auto; margin-top: 15px; border-radius: 4px;}
    </style>
</head>
<body>

    <h1>Optical Transfer (Diagnostic Mode)</h1>

    <div class="container">
        <!-- SENDER SECTION -->
        <div class="card">
            <h2>1. Broadcast File</h2>
            <input type="file" id="fileInput" style="margin-bottom: 10px;" />
            <br>
            <button class="btn" onclick="startBroadcast()">Auto-Play</button>
            <button class="btn btn-warning" onclick="pauseBroadcast()">Pause</button>
            <button class="btn" onclick="nextFrame()">Next Frame (Manual)</button>
            
            <div id="broadcastStatus" class="status" style="color: #007bff;"></div>
            <div id="qrcode-container">
                <div id="qrcode"></div>
            </div>
        </div>

        <!-- RECEIVER SECTION -->
        <div class="card">
            <h2>2. Receive File</h2>
            <button class="btn" onclick="startScanner()">Start Scanner</button>
            <button class="btn btn-danger" onclick="stopScanner()">Stop</button>
            
            <div id="reader"></div>
            
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="receiveStatus" class="status">Waiting to start...</div>
            
            <div class="debug-log" id="debugLog">System Ready...<br></div>

            <div id="downloadArea" style="margin-top: 15px; display: none;">
                <a id="downloadLink" class="btn" style="display: inline-block; text-decoration: none;" download="received_file">Download Reconstructed File</a>
            </div>
        </div>
    </div>

    <script>
        function logDebug(msg) {
            const log = document.getElementById('debugLog');
            log.innerHTML = msg + "<br>" + log.innerHTML;
        }

        // --- SENDER LOGIC ---
        const CHUNK_SIZE = 40; // Extremely small chunks to guarantee easy scanning
        const FPS = 1.5; // Very slow frame rate
        let frames = [];
        let currentFrameIdx = 0;
        let broadcastInterval = null;
        let qrCodeInstance = null;

        function startBroadcast() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) {
                alert("Please select a file first.");
                return;
            }

            if (frames.length === 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    generateFrames(e.target.result);
                    playLoop();
                };
                reader.readAsDataURL(file);
            } else {
                playLoop(); // Resume if already generated
            }
        }

        function generateFrames(data) {
            frames = [];
            const totalChunks = Math.ceil(data.length / CHUNK_SIZE);
            for (let i = 0; i < totalChunks; i++) {
                const chunk = data.substr(i * CHUNK_SIZE, CHUNK_SIZE);
                frames.push(`${i}|${totalChunks}|${chunk}`);
            }
            logDebug(`Generated ${totalChunks} frames.`);
            
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = ""; 
            qrCodeInstance = new QRCode(qrContainer, {
                width: 250,
                height: 250,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.L
            });
        }

        function playLoop() {
            pauseBroadcast(); // Clear any existing interval
            document.getElementById('broadcastStatus').innerText = "Broadcasting (Auto)...";
            renderCurrentFrame();
            broadcastInterval = setInterval(() => {
                nextFrame();
            }, 1000 / FPS);
        }

        function pauseBroadcast() {
            if (broadcastInterval) clearInterval(broadcastInterval);
            document.getElementById('broadcastStatus').innerText = "Broadcast Paused (Manual Mode)";
        }

        function nextFrame() {
            if (frames.length === 0) return;
            currentFrameIdx = (currentFrameIdx + 1) % frames.length;
            renderCurrentFrame();
        }

        function renderCurrentFrame() {
            qrCodeInstance.makeCode(frames[currentFrameIdx]);
        }

        // --- RECEIVER LOGIC ---
        let html5QrcodeScanner = null;
        let receivedFrames = {};
        let totalFramesExpected = 0;

        function startScanner() {
            if (html5QrcodeScanner) return;
            receivedFrames = {};
            totalFramesExpected = 0;
            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('downloadArea').style.display = 'none';
            document.getElementById('receiveStatus').innerText = "Initializing Camera...";

            html5QrcodeScanner = new Html5Qrcode("reader");
            
            // HYPER-OPTIMIZATION: Only look for QR codes, ignore all other barcode types.
            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] 
            };
            
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, (err) => {
                // Background scan failures (happens every frame a QR isn't found)
            })
            .then(() => {
                document.getElementById('receiveStatus').innerText = "Scanning Active. Point at QR code.";
                logDebug("Camera started successfully.");
            })
            .catch(err => {
                document.getElementById('receiveStatus').innerText = "Camera Error! Check console.";
                logDebug("ERROR: " + err);
            });
        }

        function onScanSuccess(decodedText) {
            const match = decodedText.match(/^(\d+)\|(\d+)\|(.*)$/);
            if (!match) {
                logDebug("Read invalid QR format. Ignoring.");
                return;
            }

            const index = parseInt(match[1], 10);
            const total = parseInt(match[2], 10);
            const data = match[3];

            if (totalFramesExpected === 0) totalFramesExpected = total;

            if (!receivedFrames[index]) {
                receivedFrames[index] = data;
                logDebug(`+ Scanned Frame [${index + 1}/${total}]`);
                updateProgress();
            }

            if (Object.keys(receivedFrames).length === totalFramesExpected) {
                finalizeTransfer();
            }
        }

        function updateProgress() {
            const receivedCount = Object.keys(receivedFrames).length;
            const percentage = (receivedCount / totalFramesExpected) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('receiveStatus').innerText = `Progress: ${receivedCount} / ${totalFramesExpected}`;
        }

        function finalizeTransfer() {
            stopScanner();
            document.getElementById('receiveStatus').innerText = "File Complete!";
            logDebug("Transfer finished! Stitching file...");
            
            let fullDataUrl = "";
            for (let i = 0; i < totalFramesExpected; i++) {
                fullDataUrl += receivedFrames[i];
            }

            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = fullDataUrl;
            document.getElementById('downloadArea').style.display = 'block';
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    html5QrcodeScanner = null;
                    document.getElementById('receiveStatus').innerText = "Scanner stopped.";
                });
            }
        }
    </script>
</body>
</html>
