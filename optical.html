<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical File Transfer (Animated QR)</title>
    
    <!-- QR Code Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- QR Code Scanning -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; color: #333; }
        h1 { text-align: center; }
        .container { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 768px) { .container { flex-direction: row; } }
        .card { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-bottom: 10px; }
        .btn:hover { background-color: #0056b3; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        #qrcode-container { display: flex; justify-content: center; margin-top: 20px; min-height: 256px;}
        .status { font-weight: bold; margin-top: 10px; text-align: center; }
        #reader { width: 100%; margin-top: 15px; }
        .progress-bar { width: 100%; background-color: #e0e0e0; border-radius: 4px; margin-top: 10px; overflow: hidden; display: none; }
        .progress-fill { height: 20px; background-color: #28a745; width: 0%; transition: width 0.2s; }
    </style>
</head>
<body>

    <h1>Multi-Frame Optical Transfer</h1>

    <div class="container">
        <!-- SENDER SECTION -->
        <div class="card">
            <h2>Broadcast File</h2>
            <p>Select a small file to broadcast as an animated sequence of QR codes.</p>
            <input type="file" id="fileInput" style="margin-bottom: 15px;" />
            <br>
            <button class="btn" onclick="startBroadcast()">Start Broadcast</button>
            <button class="btn btn-danger" onclick="stopBroadcast()">Stop</button>
            
            <div id="broadcastStatus" class="status" style="color: #007bff;"></div>
            <div id="qrcode-container">
                <div id="qrcode"></div>
            </div>
        </div>

        <!-- RECEIVER SECTION -->
        <div class="card">
            <h2>Receive File</h2>
            <p>Scan the animated QR codes to reconstruct the file.</p>
            <button class="btn" onclick="startScanner()">Start Scanner</button>
            <button class="btn btn-danger" onclick="stopScanner()">Stop Scanner</button>
            
            <div id="reader"></div>
            
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="receiveStatus" class="status">Waiting for frames...</div>
            
            <div id="downloadArea" style="margin-top: 15px; display: none;">
                <strong>Transfer Complete!</strong><br>
                <a id="downloadLink" class="btn" style="display: inline-block; margin-top: 10px; text-decoration: none;" download="received_file">Download File</a>
            </div>
        </div>
    </div>

    <script>
        // --- SENDER LOGIC ---
        const CHUNK_SIZE = 50; // Lowered to 50 bytes per frame for higher reliability
        const FPS = 2; // Lowered to 2 Frames Per Second to give cameras time to focus
        let frames = [];
        let currentFrameIdx = 0;
        let broadcastInterval = null;
        let qrCodeInstance = null;

        function startBroadcast() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) {
                alert("Please select a file first.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            // Read file as Data URL (Base64) to preserve file type for the receiver
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                generateFrames(dataUrl);
                playBroadcast();
            };
            reader.readAsDataURL(file);
        }

        function generateFrames(data) {
            frames = [];
            const totalChunks = Math.ceil(data.length / CHUNK_SIZE);
            
            for (let i = 0; i < totalChunks; i++) {
                const chunk = data.substr(i * CHUNK_SIZE, CHUNK_SIZE);
                // Format: index|total|data
                frames.push(`${i}|${totalChunks}|${chunk}`);
            }
            document.getElementById('broadcastStatus').innerText = `Broadcasting ${totalChunks} frames...`;
        }

        function playBroadcast() {
            if (broadcastInterval) clearInterval(broadcastInterval);
            
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = ""; // clear previous
            
            qrCodeInstance = new QRCode(qrContainer, {
                width: 256,
                height: 256,
                correctLevel : QRCode.CorrectLevel.L // Low correction allows more data capacity per frame
            });

            currentFrameIdx = 0;
            broadcastInterval = setInterval(() => {
                qrCodeInstance.makeCode(frames[currentFrameIdx]);
                currentFrameIdx = (currentFrameIdx + 1) % frames.length; // Loop back to start
            }, 1000 / FPS);
        }

        function stopBroadcast() {
            if (broadcastInterval) clearInterval(broadcastInterval);
            document.getElementById('broadcastStatus').innerText = "Broadcast stopped.";
        }

        // --- RECEIVER LOGIC ---
        let html5QrcodeScanner = null;
        let receivedFrames = {};
        let totalFramesExpected = 0;

        function startScanner() {
            if (html5QrcodeScanner) return;

            receivedFrames = {};
            totalFramesExpected = 0;
            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('downloadArea').style.display = 'none';
            
            // Update status to show we are waiting for permissions
            const statusEl = document.getElementById('receiveStatus');
            statusEl.innerText = "Requesting camera access...";
            statusEl.style.color = "#d9534f";

            html5QrcodeScanner = new Html5Qrcode("reader");
            
            // Adjusted config: aspectRatio helps mobile cameras scale better
            const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
            
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess,
                (errorMessage) => {
                    // This triggers constantly when a QR is NOT found in the current frame.
                    // Keep this empty so it doesn't spam your console.
                }
            )
            .then(() => {
                // If it successfully starts, update the UI
                statusEl.innerText = "Camera active. Scanning for frames...";
                statusEl.style.color = "#28a745"; // Green for success
            })
            .catch(err => {
                // If it fails (permissions, file:// protocol, etc), print it to the screen
                console.error(err);
                statusEl.innerText = "Camera Error: Please ensure you are running this on localhost/HTTPS and have granted camera permissions. Details: " + err;
                statusEl.style.color = "#d9534f";
            });
        }

        function onScanSuccess(decodedText) {
            // Parse the frame format: index|total|data
            const match = decodedText.match(/^(\d+)\|(\d+)\|(.*)$/);
            if (!match) return; // Ignore if not a valid frame

            const index = parseInt(match[1], 10);
            const total = parseInt(match[2], 10);
            const data = match[3];

            if (totalFramesExpected === 0) {
                totalFramesExpected = total;
            }

            // Save unique frame
            if (!receivedFrames[index]) {
                receivedFrames[index] = data;
                updateProgress();
            }

            // Check if transfer is complete
            if (Object.keys(receivedFrames).length === totalFramesExpected) {
                finalizeTransfer();
            }
        }

        function updateProgress() {
            const receivedCount = Object.keys(receivedFrames).length;
            const percentage = (receivedCount / totalFramesExpected) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';
            
            const statusEl = document.getElementById('receiveStatus');
            statusEl.innerText = `Received ${receivedCount} / ${totalFramesExpected} frames`;
            statusEl.style.color = "#007bff";
        }

        function finalizeTransfer() {
            stopScanner();
            const statusEl = document.getElementById('receiveStatus');
            statusEl.innerText = "File successfully reconstructed!";
            statusEl.style.color = "#28a745";
            
            // Reassemble chunks
            let fullDataUrl = "";
            for (let i = 0; i < totalFramesExpected; i++) {
                fullDataUrl += receivedFrames[i];
            }

            // Prepare download link
            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = fullDataUrl;
            document.getElementById('downloadArea').style.display = 'block';
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    html5QrcodeScanner = null;
                }).catch(err => console.error(err));
            }
        }
    </script>
</body>
</html>
