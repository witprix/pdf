<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 15px;
        }
        .file-input {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #004494;
        }
        .status {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #555;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <!-- PDF to Word Section -->
    <div class="container" id="pdf-to-word-section">
        <h2>Convert PDF to Word</h2>
        <input type="file" id="pdfFile" class="file-input" accept="application/pdf">
        <button onclick="convertPdfToWord()">Convert to .docx</button>
        <div id="pdf-status" class="status"></div>
    </div>

    <!-- Word to PDF Section -->
    <div class="container" id="word-to-pdf-section">
        <h2>Convert Word to PDF</h2>
        <input type="file" id="wordFile" class="file-input" accept=".doc, .docx">
        <button onclick="convertWordToPdf()">Convert to .pdf</button>
        <div id="word-status" class="status"></div>
    </div>

    <script>
        // REPLACE THIS WITH YOUR ACTUAL API KEY FROM PDF.CO
        const API_KEY = 'YOUR_ACTUAL_API_KEY'; 

        // ==========================================
        // LOGIC 1: PDF to Word Conversion
        // ==========================================
        async function convertPdfToWord() {
            const fileInput = document.getElementById('pdfFile');
            const statusDiv = document.getElementById('pdf-status');
            
            if (!fileInput.files[0]) {
                statusDiv.innerText = "Please select a PDF file first.";
                return;
            }

            const file = fileInput.files[0];
            statusDiv.innerText = `Uploading and processing ${file.name}... this may take a moment.`;

            try {
                const tokenHeader = { 'x-api-key': API_KEY };
                
                // Step A: Get presigned URL
                let response = await fetch(`https://api.pdf.co/v1/file/upload/get-presigned-url?name=${encodeURIComponent(file.name)}`, { headers: tokenHeader });
                let data = await response.json();
                if (data.error) throw new Error(data.message);
                const presignedUrl = data.presignedUrl;
                const uploadedFileUrl = data.url;

                // Step B: Upload file
                await fetch(presignedUrl, { method: 'PUT', body: file });

                // Step C: Convert to DOCX
                const convertRes = await fetch('https://api.pdf.co/v1/pdf/convert/to/doc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                    body: JSON.stringify({ 
                        url: uploadedFileUrl, 
                        name: file.name.replace(/\.pdf$/i, '.docx') 
                    })
                });
                const convertData = await convertRes.json();
                if (convertData.error) throw new Error(convertData.message);

                // Step D: Download Export
                window.location.href = convertData.url;
                statusDiv.innerText = "Conversion successful! Download starting...";
                
            } catch (error) {
                console.error("PDF to Word Error:", error);
                statusDiv.innerText = `Error: ${error.message}. Check console or API Key.`;
            }
        }

        // ==========================================
        // LOGIC 2: Word to PDF Conversion
        // ==========================================
        async function convertWordToPdf() {
            const fileInput = document.getElementById('wordFile');
            const statusDiv = document.getElementById('word-status');
            
            if (!fileInput.files[0]) {
                statusDiv.innerText = "Please select a Word file first.";
                return;
            }

            const file = fileInput.files[0];
            statusDiv.innerText = `Uploading and processing ${file.name}... this may take a moment.`;

            try {
                const tokenHeader = { 'x-api-key': API_KEY };
                
                // Step A: Get presigned URL
                let response = await fetch(`https://api.pdf.co/v1/file/upload/get-presigned-url?name=${encodeURIComponent(file.name)}`, { headers: tokenHeader });
                let data = await response.json();
                if (data.error) throw new Error(data.message);
                const presignedUrl = data.presignedUrl;
                const uploadedFileUrl = data.url;

                // Step B: Upload file
                await fetch(presignedUrl, { method: 'PUT', body: file });

                // Step C: Convert to PDF
                const convertRes = await fetch('https://api.pdf.co/v1/pdf/convert/from/doc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                    body: JSON.stringify({ 
                        url: uploadedFileUrl, 
                        name: file.name.replace(/\.docx?$/i, '.pdf') 
                    })
                });
                const convertData = await convertRes.json();
                if (convertData.error) throw new Error(convertData.message);

                // Step D: Download Export
                window.location.href = convertData.url;
                statusDiv.innerText = "Conversion successful! Download starting...";
                
            } catch (error) {
                console.error("Word to PDF Error:", error);
                statusDiv.innerText = `Error: ${error.message}. Check console or API Key.`;
            }
        }
    </script>
</body>
</html>
